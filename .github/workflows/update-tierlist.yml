name: Update MLBB Tier List Telemetry

on:
  schedule:
    # Daily at 01:00 UTC (1 hour after Moonton's 00:00 UTC daily recalculation)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-build:
    name: Sync Telemetry & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute telemetry sync
        run: npm run sync

      - name: Build static production bundle
        run: npm run build

      - name: Verify production bundle size (<50KB gzip)
        run: npm run check:bundle

      - name: Commit updated data artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json public/meta-tierlist.json data/airgap/*.json
          if git diff --staged --quiet; then
            echo "No changes in telemetry datasets."
          else
            git commit -m "chore(telemetry): automated daily rank data refresh [skip ci]"
            git push
          fi
